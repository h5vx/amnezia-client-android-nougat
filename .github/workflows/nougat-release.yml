name: 'Android 7 (Nougat) release'

# Builds the Android 7 (API 24) client with Qt 6.6 and publishes a GitHub release.
# Push a tag named <AMNEZIAVPN_VERSION>-nougat (e.g. 5.0.3.0-nougat) to release;
# run manually to only build the APKs as workflow artifacts.

on:
  push:
    tags:
      - '*-nougat'
  workflow_dispatch:

env:
  QT_VERSION: 6.6.3
  QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
  ANDROID_NDK_VERSION: 27.0.11718014
  ANDROID_BUILD_TOOLS_VERSION: 36.0.0

jobs:
  Version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: CMakeLists.txt
        sparse-checkout-cone-mode: false

    - name: 'Get release version'
      id: version
      run: |
        version=$(grep -oP 'set\(AMNEZIAVPN_VERSION \K[0-9.]+' CMakeLists.txt)
        release="${version}-nougat"
        if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$release" ]]; then
          echo "::error::Tag $GITHUB_REF_NAME doesn't match CMakeLists.txt version, expected $release"
          exit 1
        fi
        echo "release=$release" >> "$GITHUB_OUTPUT"

  Build-Android:
    needs: Version
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            qt_arch: android_armv7
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86
            qt_arch: android_x86
          - abi: x86_64
            qt_arch: android_x86_64

    env:
      RELEASE: ${{ needs.Version.outputs.release }}

    steps:
    - name: 'Free disk space'
      run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        cache: true
        setup-python: false
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install ${{ matrix.qt_arch }} Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: ${{ matrix.qt_arch }}
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        cache: true
        setup-python: false
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Make Qt tools executable'
      run: chmod +x "$RUNNER_TEMP"/Qt/$QT_VERSION/*/bin/*

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v4
      with:
        packages: >-
          platforms;android-36
          build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          ndk;${{ env.ANDROID_NDK_VERSION }}

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # the project and some bundled subprojects don't configure with CMake 4
    - name: 'Install conan, cmake and ninja'
      run: pip install "conan==2.28.0" "cmake<4" ninja

    - name: 'Cache conan packages'
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: conan-nougat-${{ matrix.abi }}-ndk${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('conanfile.py', 'recipes/**', 'cmake/conan_provider.cmake', 'cmake/platform_settings.cmake', 'cmake/recipes_bootstrap.cmake') }}

    - name: 'Decode keystore secret to file'
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android.keystore"

    - name: 'Build APK'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android.keystore
        QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_KEY_ALIAS }}
        QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_KEY_PASS }}
      run: |
        deploy/build.sh -t android --sign --abi ${{ matrix.abi }} --build deploy/build/${{ matrix.abi }}

        mkdir -p deploy/artifacts
        mv deploy/build/${{ matrix.abi }}/client/android-build/build/outputs/apk/oss/release/android-build-oss-release.apk \
           deploy/artifacts/AmneziaVPN_${RELEASE}_${{ matrix.abi }}.apk

    - name: 'Check APK'
      run: |
        apk=deploy/artifacts/AmneziaVPN_${RELEASE}_${{ matrix.abi }}.apk
        tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
        "$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -q 'minSdkVersion(0x0101020c)=24' \
          || { echo "::error::APK minSdkVersion is not 24"; exit 1; }
        "$tools/apksigner" verify --print-certs "$apk"

    - name: 'Remove conan build trees before caching'
      run: conan cache clean "*" --source --build --download --temp

    - name: 'Upload APK'
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ matrix.abi }}
        path: deploy/artifacts/*.apk
        retention-days: 7

  Release:
    needs: [Version, Build-Android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE: ${{ needs.Version.outputs.release }}

    steps:
    - name: 'Download APKs'
      uses: actions/download-artifact@v4
      with:
        pattern: apk-*
        merge-multiple: true
        path: apk

    - name: 'Create release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd apk
        sha256sum *.apk > SHA256SUMS.txt

        cat > notes.md <<EOF
        AmneziaVPN ${RELEASE%-nougat} built for **Android 7.0 / 7.1 (Nougat, API 24/25)** and newer, with Qt ${QT_VERSION}.

        This is an unofficial build. It is signed with a different key than the official AmneziaVPN releases,
        so the official app has to be uninstalled first (make a backup in Settings → Backup to keep your connections).

        Which APK to choose: \`armeabi-v7a\` works on any ARM phone, \`arm64-v8a\` is for 64-bit ARM phones.
        EOF

        gh release create "$GITHUB_REF_NAME" *.apk SHA256SUMS.txt \
          --repo "$GITHUB_REPOSITORY" \
          --verify-tag \
          --title "AmneziaVPN ${RELEASE} (Android 7)" \
          --notes-file notes.md
